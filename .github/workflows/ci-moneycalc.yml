name: CI - 财务小算盘

on:
  push:
    branches: [main, 'release/**']
    tags: ['moneycalc-v*']
    paths:
      - 'src/MoneyCalc/**'
      - '.github/workflows/ci-moneycalc.yml'
  pull_request:
    paths:
      - 'src/MoneyCalc/**'
  workflow_dispatch:

permissions:
  contents: write        # release job 要创建 Release，需要写权限

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 主项目和测试项目都要还原：编译步骤带 --no-restore，
      # 只还原测试项目时主项目会缺 obj/project.assets.json，报 NETSDK1004。
      - name: 还原依赖
        run: |
          dotnet restore src/MoneyCalc/MoneyCalc.csproj
          dotnet restore src/MoneyCalc/MoneyCalc.Tests/MoneyCalc.Tests.csproj

      - name: 编译
        run: dotnet build src/MoneyCalc/MoneyCalc.csproj -c Release --no-restore

      - name: 跑单元测试
        run: dotnet test src/MoneyCalc/MoneyCalc.Tests/MoneyCalc.Tests.csproj -c Release --logger "trx;LogFileName=test-results.trx"

      - name: 发布单文件
        run: >
          dotnet publish src/MoneyCalc/MoneyCalc.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o out

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MoneyCalc-win-x64
          path: out/MoneyCalc.exe
          if-no-files-found: error

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-MoneyCalc
          path: '**/test-results.trx'
          if-no-files-found: ignore

  # 推 moneycalc-v* 标签时才跑：把 CI 构建出的 exe 挂到 Release 上。
  release:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/moneycalc-v')
    runs-on: ubuntu-latest
    steps:
      - name: 取回构建产物
        uses: actions/download-artifact@v4
        with:
          name: MoneyCalc-win-x64
          path: dist

      - name: 创建 Release 并附上 exe
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          gh release create "$TAG" dist/MoneyCalc.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
          || gh release upload "$TAG" dist/MoneyCalc.exe --clobber --repo "$GITHUB_REPOSITORY"
