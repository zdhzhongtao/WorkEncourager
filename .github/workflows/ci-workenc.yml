name: CI - 上班鼓励器

on:
  push:
    branches: [main, 'release/**']
    tags: ['workenc-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # release job 要创建 Release，需要写权限

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 主项目和测试项目都要还原：编译步骤带 --no-restore，
      # 只还原测试项目时 WorkEncourager.csproj 会缺 obj/project.assets.json，
      # 报 NETSDK1004（v2.2.0 的两次 CI 都是挂在这里）。
      - name: 还原依赖
        run: |
          dotnet restore src/WorkEnc/WorkEncourager.csproj
          dotnet restore src/WorkEnc/WorkEnc.Tests/WorkEnc.Tests.csproj

      - name: 编译
        run: dotnet build src/WorkEnc/WorkEncourager.csproj -c Release --no-restore

      - name: 跑单元测试
        run: dotnet test src/WorkEnc/WorkEnc.Tests/WorkEnc.Tests.csproj -c Release --logger "trx;LogFileName=test-results.trx"

      # tag 是 workenc-v2.2.3 这种形状，不能直接当 -p:Version 用（会被判非法版本号）。
      # 先剥掉前缀；不是 tag 触发的构建就沿用 csproj 里的版本。
      - name: 算版本号
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME -replace '^workenc-v', ''
          } else {
            $m = Select-String -Path src/WorkEnc/WorkEncourager.csproj -Pattern '<Version>([^<]+)</Version>'
            $v = if ($m) { $m.Matches[0].Groups[1].Value } else { '0.0.0' }
          }
          if ($v -notmatch '^\d+(\.\d+){1,3}') { throw "抠不出合法版本号：$v" }
          "value=$v" >> $env:GITHUB_OUTPUT
          "算出发布版本：$v"

      - name: 发布单文件
        run: >
          dotnet publish src/WorkEnc/WorkEncourager.csproj -c Release -r win-x64
          --self-contained false -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.value }} -o out

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: WorkEncourager-win-x64
          path: out/WorkEncourager.exe
          if-no-files-found: error

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'
          if-no-files-found: ignore

  # 推 workenc-v* 标签时才跑：把上面 CI 构建出的 exe 挂到 Release 上。
  # 程序里的「检查更新」按这个前缀筛 releases.atom，前缀对不上就永远看不到更新。
  release:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/workenc-v')
    runs-on: ubuntu-latest
    steps:
      - name: 取回构建产物
        uses: actions/download-artifact@v4
        with:
          name: WorkEncourager-win-x64
          path: dist

      - name: 创建 Release 并附上 exe
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          gh release create "$TAG" dist/WorkEncourager.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
          || gh release upload "$TAG" dist/WorkEncourager.exe --clobber --repo "$GITHUB_REPOSITORY"
