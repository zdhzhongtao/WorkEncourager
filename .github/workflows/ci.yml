name: CI

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # release job 要创建 Release，需要写权限

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 主项目和测试项目都要还原：编译步骤带 --no-restore，
      # 只还原测试项目时 WorkEncourager.csproj 会缺 obj/project.assets.json，
      # 报 NETSDK1004（v2.2.0 的两次 CI 都是挂在这里）。
      - name: 还原依赖
        run: |
          dotnet restore WorkEncourager.csproj
          dotnet restore WorkEnc.Tests/WorkEnc.Tests.csproj

      - name: 编译
        run: dotnet build WorkEncourager.csproj -c Release --no-restore

      - name: 跑单元测试
        run: dotnet test WorkEnc.Tests/WorkEnc.Tests.csproj -c Release --logger "trx;LogFileName=test-results.trx"

      - name: 发布单文件
        run: >
          dotnet publish WorkEncourager.csproj -c Release -r win-x64
          --self-contained false -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o out

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: WorkEncourager-win-x64
          path: out/WorkEncourager.exe
          if-no-files-found: error

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'
          if-no-files-found: ignore

  # 推 v* 标签时才跑：把上面 CI 构建出的 exe 挂到 Release 上。
  # 程序里的「检查更新」读的是 /releases/latest，必须有 Release 才算真正发版。
  release:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 取回构建产物
        uses: actions/download-artifact@v4
        with:
          name: WorkEncourager-win-x64
          path: dist

      - name: 创建 Release 并附上 exe
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          gh release create "$TAG" dist/WorkEncourager.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
          || gh release upload "$TAG" dist/WorkEncourager.exe --clobber --repo "$GITHUB_REPOSITORY"
