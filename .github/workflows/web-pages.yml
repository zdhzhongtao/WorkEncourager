name: web-pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # 单文件版（JS/CSS 全内联，file:// 双击可用）——同时放到站点根目录，
      # 想离线用的人可以直接右键另存，或者给 MdViewer 打包用
      - name: Build standalone
        run: npm run build:standalone

      - name: Copy standalone into site
        run: cp release/WadeToolbox-Web.html dist/toolbox.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
